# External override loaded via YANSEN_CONFIG_FILE (see bin/yansen.sh).
# Business config (models, agents, prompts, tools, skills, mcp) lives in SQLite — not here.

server:
  port: "${YANSEN_PORT:8080}"
  maxRequestSizeBytes: 10000
  keepAliveIntervalSeconds: "${YANSEN_KEEPALIVE_INTERVAL:10}"
  sseIdleTimeoutSeconds: "${YANSEN_SSE_IDLE_TIMEOUT:300}"
  sseEventTimeoutSeconds: "${YANSEN_SSE_EVENT_TIMEOUT:120}"
  chatTimeoutSeconds: "${YANSEN_CHAT_TIMEOUT:300}"
  # NOTE: When deployed behind a reverse proxy, ensure the proxy read-idle timeout
  # exceeds keepAliveIntervalSeconds so SSE heartbeats keep the stream alive.

database:
  # Production today: database.type must be "sqlite".
  type: "${YANSEN_DB_TYPE:sqlite}"
  sqlite:
    path: "${YANSEN_SQLITE_PATH:store/yansen.db}"
  # FUTURE: MySQL not implemented; reserved for upcoming ConfigStore support.
  mysql:
    jdbcUrl: "${YANSEN_MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/yansen?useSSL=false&serverTimezone=UTC}"
    username: "${YANSEN_MYSQL_USER:yansen}"
    password: "${YANSEN_MYSQL_PASSWORD:}"
    maximumPoolSize: "${YANSEN_MYSQL_POOL_SIZE:10}"
