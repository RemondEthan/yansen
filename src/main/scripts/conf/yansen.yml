server:
  port: "${YANSEN_PORT:8080}"
  maxRequestSizeBytes: 10000

# Each model is identified by its key (referenced from agents[*].model).
# provider is one of: openai-compatible | minimax | ... (more added in PR2).
models:
  default:
    provider: openai-compatible
    modelName: MiniMax-M3
    baseUrl: https://api.minimaxi.com/v1
    apiKey: "${MINIMAX_API_KEY:}"
    # Max retry attempts on retryable errors (timeout, rate-limit, IO).
    # Framework default is 3; set to 1 to disable retries.
    maxRetries: "${YANSEN_MODEL_MAX_RETRIES:3}"
    # HTTP transport timeouts — only override when the defaults are insufficient.
    # readTimeoutSeconds is the critical knob for large-context SSE streams —
    # it controls the OkHttp/JDK read timeout on the HTTP connection.
    # Framework defaults: connect=30s, read=5min(300s), write=30s
    connectTimeoutSeconds: "${YANSEN_CONNECT_TIMEOUT:300}"
    readTimeoutSeconds: "${YANSEN_READ_TIMEOUT:900}"
    writeTimeoutSeconds: "${YANSEN_WRITE_TIMEOUT:300}"

# Where to discover AgentSkill SKILL.md files. Either source can be omitted.
skills:
  workspaceDir: skills
  classpathBase: skills

# MCP server definitions; referenced by agents[*].mcp[].
mcp: {}

# Each agent binds a model id plus runtime concerns (workspace, system prompt, tools/skills/mcp).
agents:
  default:
    model: default
    workspace: "${YANSEN_WORKSPACE:}"
    systemPromptPath: "${YANSEN_SYSTEM_PROMPT:}"
    tools: []
    skills: []
    mcp: []
